services:
  - type: web
    name: nicky-nssf-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: COLLECTION
        value: nssf
      - key: DATABASE_URL
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com
      - key: LANGFUSE_ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://nicky-nssf-chatbot.onrender.com
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_CHAT_ENDPOINT
        sync: false
      - key: AZURE_CHAT_API_KEY
        sync: false
      - key: AZURE_CHAT_DEPLOYMENT
        sync: false
      - key: AZURE_CHAT_API_VERSION
        sync: false
      - key: AZURE_EMBED_ENDPOINT
        sync: false
      - key: AZURE_EMBED_API_KEY
        sync: false
      - key: AZURE_EMBED_DEPLOYMENT
        sync: false
      - key: AZURE_EMBED_API_VERSION
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  - type: web
    name: nicky-nssf-chatbot
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nicky-nssf-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
