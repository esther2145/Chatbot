services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant

  voice-agent:
    build: ./voice-agent
    profiles:
      - docker-agent
    env_file:
      - .env
    environment:
      - RAG_API_URL=http://backend:8001/api/ask
    depends_on:
      - backend

volumes:
  qdrant_data:
